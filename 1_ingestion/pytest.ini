# pytest settings for 1_ingestion. Run from the repo root:  .venv/bin/python -m pytest 1_ingestion/tests
# (also runs the older unittest files). Browser tests: add  -m e2e  (see docs/UI.md).
[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    e2e: browser tests with Playwright (slower; need Chromium, see docs/UI.md)
addopts = -m "not e2e"
