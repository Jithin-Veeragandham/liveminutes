<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveMinutes live</title>
<!-- Served by bridge.py at /live/<bot_id>. Long-polls /live/<bot_id>/data: the bridge answers as soon as something changes. -->
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2026; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
    --bot: #eef2ff; --chat: #f0fdf4; --err: #fef2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --panel: #1a1d23; --text: #e5e7eb; --muted: #9ca3af; --line: #2b2f37;
      --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
      --bot: #1e2238; --chat: #15261b; --err: #2d1717;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif;
         height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
           display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  header h1 { font-size: 17px; margin: 0; }
  header a { color: var(--accent); font-size: 13px; }
  .pill { font-size: 12px; padding: 2px 10px; border-radius: 99px; border: 1px solid currentColor; }
  .on { color: var(--ok); } .off { color: var(--warn); } .bad { color: var(--bad); } .muted { color: var(--muted); }
  #people { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  #people span { font-size: 13px; padding: 2px 8px; border-radius: 6px; background: var(--panel);
                 border: 1px solid var(--line); }
  main { flex: 1; display: grid; grid-template-columns: 2fr 1fr; min-height: 0; }
  section { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  section:last-child { border-right: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 0; padding: 10px 16px; }
  .scroll { overflow-y: auto; flex: 1; padding: 0 16px 16px; }
  .line { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .line .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; font-size: 13px; }
  .line .who { font-weight: 600; margin-right: 6px; }
  .ev { font-size: 13px; padding: 5px 8px; margin: 4px 0; border-radius: 6px; white-space: pre-wrap; }
  .ev .t { color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
  .ev.bot { background: var(--bot); } .ev.chat { background: var(--chat); } .ev.error { background: var(--err); }
  .empty { color: var(--muted); padding: 12px 0; }
  @media (max-width: 760px) {
    body { height: auto; }
    main { grid-template-columns: 1fr; }
    section { border-right: 0; border-bottom: 1px solid var(--line); }
    .scroll { max-height: 60vh; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">LiveMinutes</h1>
  <span id="state" class="pill muted">connecting…</span>
  <span id="rec" class="pill muted"></span>
  <a href="/live">all sessions</a>
  <a id="logs-link" href="/live">bot logs</a>
</header>
<div id="people"></div>
<main>
  <section>
    <h2>Transcript</h2>
    <div class="scroll" id="transcript"><div class="empty">Nothing yet. Lines appear about 1.5 s after someone stops talking.</div></div>
  </section>
  <section>
    <h2>Bot activity</h2>
    <div class="scroll" id="activity"></div>
  </section>
</main>
<script>
const botId = location.pathname.split("/").filter(Boolean).pop();
const $ = id => document.getElementById(id);
let next = 0, shownLines = 0, failures = 0, version = null;
$("logs-link").href = "/live#bot=" + encodeURIComponent(botId);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;  // textContent only: chat and names are untrusted
  return e;
}
function nearBottom(box) { return box.scrollHeight - box.scrollTop - box.clientHeight < 80; }
function setPill(node, text, cls) { node.textContent = text; node.className = "pill " + cls; }

function render(d) {
  $("title").textContent = "LiveMinutes · " + (d.bot_name || d.bot_id);
  document.title = "LiveMinutes · " + d.bot_id;
  const ended = ["ended", "fatal_error", "saved", "not found"].includes(d.state);
  setPill($("state"), d.state.replace(/_/g, " "), d.state === "not found" ? "bad" : ended ? "muted" : "on");
  if (!d.live) $("rec").textContent = "";
  else if (d.declined) setPill($("rec"), "declined: deleted", "bad");
  else if (d.recording) setPill($("rec"), "● recording", "on");
  else setPill($("rec"), d.consent ? "paused: waiting for consent" : "not recording", "off");

  const people = $("people");
  people.replaceChildren(...d.people.filter(p => p.present).map(p => {
    const mark = p.decision === "yes" ? "✓" : p.decision === "no" ? "✗" : "…";
    const s = el("span", p.decision === "yes" ? "on" : p.decision === "no" ? "bad" : "off",
                 `${mark} ${p.name}` + (p.vouched_by ? ` (by ${p.vouched_by})` : ""));
    return s;
  }));
  people.style.display = d.people.some(p => p.present) ? "" : "none";

  // Transcript: earlier lines can still change (merging), so redraw it when it changes.
  const box = $("transcript"), stick = nearBottom(box);
  const key = JSON.stringify(d.transcript);
  if (key !== box.dataset.key) {
    box.dataset.key = key;
    if (d.transcript.length) {
      box.replaceChildren(...d.transcript.map(l => {
        const row = el("div", "line");
        row.append(el("span", "t", l.t), el("span", "who", l.who + ":"), document.createTextNode(l.text));
        return row;
      }));
    }
    if (stick || d.transcript.length > shownLines) box.scrollTop = box.scrollHeight;
    shownLines = d.transcript.length;
  }

  const act = $("activity"), stickA = nearBottom(act);
  for (const e of d.activity) {
    const row = el("div", "ev " + e.kind);
    row.append(el("span", "t", e.time), document.createTextNode(e.text));
    act.append(row);
  }
  if (d.activity.length && stickA) act.scrollTop = act.scrollHeight;
  next = d.next;
  return d.live && !ended;
}

async function poll() {
  let again = true;
  try {
    // v=: the bridge holds the request until something changes (long poll), so lines show at once.
    const v = version === null ? "" : `&v=${version}`;
    const r = await fetch(`/live/${botId}/data?after=${next}${v}`, { cache: "no-store" });
    const d = await r.json();
    again = render(d);
    version = d.version ?? null;  // saved sessions have none: plain polling
    failures = 0;
  } catch (e) {
    failures++;
    setPill($("state"), "bridge not reachable", "bad");
  }
  const wait = failures ? Math.min(10000, 1000 * failures) : version === null ? 1000 : 50;
  if (again) setTimeout(poll, wait);
}
poll();
</script>
</body>
</html>
