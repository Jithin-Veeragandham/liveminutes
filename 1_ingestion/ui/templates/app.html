<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="same-origin">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}}</title>
<link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
<link rel="preload" href="/static/vendor/inter/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<!-- Set the theme before anything paints, so there is no flash of the wrong one. -->
<script nonce="{{NONCE}}">(function(){var c="system";try{c=localStorage.getItem("lm-theme")||"system";}catch(e){}var d=c==="dark"||(c!=="light"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);var r=document.documentElement;r.setAttribute("data-theme",d?"dark":"light");r.setAttribute("data-theme-choice",c);})();</script>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/print.css" media="print">
<script type="application/json" id="lm-config">{{CONFIG}}</script>
<script type="module" src="/static/js/{{ENTRY}}.js"></script>
</head>
<body class="{{BODY_CLASS}}">
<a class="skip-link" href="#main">Skip to content</a>
<div id="root" aria-busy="true">
  <div class="app" aria-hidden="true">
    <div class="header"><div class="skel"></div></div>
  </div>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="false"></div>
<div id="print-minutes" class="print-minutes"></div>
<noscript><p>LiveMinutes needs JavaScript to show the live notes.</p></noscript>
</body>
</html>
