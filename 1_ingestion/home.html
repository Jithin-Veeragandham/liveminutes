<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveMinutes</title>
<!-- Served by bridge.py at /live. Tabs: Sessions (list) and Send bot (send a bot + watch its logs).
     #sessions, #send and #bot=<bot_id> in the address pick the tab, so links and refreshes keep it. -->
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2026; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
    --bot: #eef2ff; --chat: #f0fdf4; --err: #fef2f2; --groq: #fdf6e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --panel: #1a1d23; --text: #e5e7eb; --muted: #9ca3af; --line: #2b2f37;
      --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
      --bot: #1e2238; --chat: #15261b; --err: #2d1717; --groq: #2a2414;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  header { padding: 12px 16px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0 0 8px; }
  [role=tablist] { display: flex; gap: 4px; }
  [role=tab] { font: inherit; font-size: 14px; background: none; border: 0; color: var(--muted); cursor: pointer;
               padding: 8px 12px; border-bottom: 2px solid transparent; }
  [role=tab][aria-selected=true] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  [role=tab]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .pill { font-size: 12px; padding: 2px 10px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
  .on { color: var(--ok); } .off { color: var(--warn); } .bad { color: var(--bad); }

  /* Sessions */
  #sessions { list-style: none; margin: 0; padding: 0; }
  #sessions li { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 8px 0;
                 border-bottom: 1px solid var(--line); }
  #sessions .id { font-family: ui-monospace, monospace; font-size: 14px; }
  #sessions .when { color: var(--muted); font-size: 13px; margin-left: auto; font-variant-numeric: tabular-nums; }

  /* Send bot */
  form { display: grid; grid-template-columns: 1fr 200px auto; gap: 8px; align-items: end;
         background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
          border-radius: 6px; padding: 7px 10px; min-width: 0; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.primary { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0;
                   border-radius: 6px; padding: 8px 16px; cursor: pointer; }
  button.primary:disabled { opacity: .6; cursor: wait; }
  #send-msg { margin: 8px 2px 0; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #logpanel { margin-top: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
              display: flex; flex-direction: column; }
  #logpanel[hidden] { display: none; }
  .loghead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 10px 12px;
             border-bottom: 1px solid var(--line); }
  .loghead h2 { font-size: 15px; margin: 0; font-family: ui-monospace, monospace; font-weight: 600; }
  .loghead .grow { margin-left: auto; font-size: 13px; }
  #status { padding: 8px 12px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
  #status .bad { color: var(--bad); }
  .filters { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 12px; font-size: 13px;
             border-bottom: 1px solid var(--line); }
  .filters label { flex-direction: row; align-items: center; gap: 4px; color: var(--text); }
  #log { height: 60vh; overflow-y: auto; padding: 4px 12px 12px; }
  .ev { font-size: 13px; padding: 5px 8px; margin: 4px 0; border-radius: 6px; white-space: pre-wrap;
        overflow-wrap: anywhere; display: flex; gap: 8px; }
  .ev .t { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .ev .src { flex: none; width: 66px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
             color: var(--muted); padding-top: 1px; }
  .ev.attendee { background: var(--bot); } .ev.groq { background: var(--groq); } .ev.chat { background: var(--chat); }
  .ev.error { background: var(--err); } .ev.error .src { color: var(--bad); }
  .empty { color: var(--muted); padding: 12px 0; }
  @media (max-width: 680px) {
    form { grid-template-columns: 1fr; }
    #sessions .when { margin-left: 0; }
    .ev { flex-wrap: wrap; }
    .ev .src { width: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>LiveMinutes</h1>
  <nav role="tablist" aria-label="Views">
    <button role="tab" id="tab-sessions" aria-controls="panel-sessions" aria-selected="true">Sessions</button>
    <button role="tab" id="tab-send" aria-controls="panel-send" aria-selected="false">Send bot</button>
  </nav>
</header>
<main>
  <section role="tabpanel" id="panel-sessions" aria-labelledby="tab-sessions">
    <ul id="sessions"><li class="empty">Loading…</li></ul>
  </section>

  <section role="tabpanel" id="panel-send" aria-labelledby="tab-send" hidden>
    <form id="send-form" autocomplete="off">
      <label>Meeting link
        <input id="link" required placeholder="https://meet.google.com/abc-defg-hij or a Teams link">
      </label>
      <label>Bot name
        <input id="name" value="LiveMinutes" maxlength="60">
      </label>
      <button class="primary" id="send-btn" type="submit">Send bot</button>
    </form>
    <p id="send-msg" class="muted">The bot joins the meeting, pauses itself and asks everyone for consent in the chat.
Admit it if the meeting has a waiting room. Its logs show up below.</p>

    <div id="logpanel" hidden>
      <div class="loghead">
        <h2 id="log-title"></h2>
        <span id="log-state" class="pill muted">loading…</span>
        <a class="grow" id="open-transcript" href="#">open transcript →</a>
      </div>
      <div id="status"></div>
      <div class="filters">
        <span class="muted">Show:</span>
        <label><input type="checkbox" data-src="attendee" checked> Attendee (bot)</label>
        <label><input type="checkbox" data-src="bridge" checked> Bridge (webhooks, consent, chat)</label>
        <label><input type="checkbox" data-src="groq" checked> Groq uploads</label>
      </div>
      <div id="log"></div>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const ENDED = ["ended", "fatal_error"];
let current = null, timer = null, failures = 0, lastData = null, shownKey = "";

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;  // textContent only: names, chat and errors are untrusted
  return e;
}
function setPill(node, text, cls) { node.textContent = text; node.className = "pill " + cls; }
function clock(ms) {
  return ms ? new Date(ms).toLocaleTimeString([], { hour12: false }) : "";
}
function words(s) { return String(s || "").replace(/_/g, " "); }

// ---------------- tabs ----------------
function showTab(name) {
  for (const t of ["sessions", "send"]) {
    $("tab-" + t).setAttribute("aria-selected", t === name);
    $("tab-" + t).tabIndex = t === name ? 0 : -1;
    $("panel-" + t).hidden = t !== name;
  }
  if (name === "sessions") loadSessions();
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("bot=")) { showTab("send"); watch(h.slice(4)); }
  else showTab(h === "send" ? "send" : "sessions");
}
$("tab-sessions").onclick = () => { location.hash = "sessions"; };
$("tab-send").onclick = () => { location.hash = current ? "bot=" + encodeURIComponent(current) : "send"; };
document.querySelector("[role=tablist]").addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    const other = document.activeElement.id === "tab-sessions" ? "tab-send" : "tab-sessions";
    $(other).focus(); $(other).click();
  }
});
window.addEventListener("hashchange", route);

// ---------------- Sessions tab ----------------
async function loadSessions() {
  const list = $("sessions");
  try {
    const r = await fetch("/live/api/sessions", { cache: "no-store" });
    const rows = await r.json();
    if (!rows.length) { list.replaceChildren(el("li", "empty", "No sessions yet. Use Send bot to start one.")); return; }
    list.replaceChildren(...rows.map(s => {
      const li = el("li");
      const a = el("a", "id", s.bot_id); a.href = "/live/" + encodeURIComponent(s.bot_id);
      li.append(a);
      if (s.live) li.append(el("span", "pill bad", "live"));
      const logs = el("a", "", "logs"); logs.href = "#bot=" + encodeURIComponent(s.bot_id);
      li.append(logs, el("span", "when", new Date(s.changed_ms).toLocaleString([], { hour12: false })));
      return li;
    }));
  } catch (e) {
    list.replaceChildren(el("li", "empty bad", "Bridge not reachable."));
  }
}
setInterval(() => { if (!$("panel-sessions").hidden) loadSessions(); }, 5000);

// ---------------- Send bot tab ----------------
function sendMsg(text, cls) { $("send-msg").textContent = text; $("send-msg").className = cls || "muted"; }

$("send-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = $("send-btn");
  btn.disabled = true;
  sendMsg("Sending the bot…");
  try {
    const r = await fetch("/live/api/send", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ link: $("link").value, name: $("name").value }),
    });
    const d = await r.json();
    if (!r.ok) {
      let text = d.error || ("HTTP " + r.status);
      if (d.detail) text += "\n" + (typeof d.detail === "string" ? d.detail : JSON.stringify(d.detail)).slice(0, 600);
      sendMsg(text, "bad");
      return;
    }
    sendMsg(`${d.name} (${d.bot_id}) is on its way to ${d.link}.\n` +
            "Admit it if there is a waiting room, then everyone replies yes in the meeting chat.", "on");
    $("link").value = "";
    location.hash = "bot=" + encodeURIComponent(d.bot_id);
  } catch (e) {
    sendMsg("Bridge not reachable.", "bad");
  } finally {
    btn.disabled = false;
  }
});

function watch(id) {
  if (id === current) return;
  current = id; lastData = null; shownKey = ""; failures = 0;
  clearTimeout(timer);
  $("logpanel").hidden = false;
  $("log-title").textContent = id;
  $("open-transcript").href = "/live/" + encodeURIComponent(id);
  setPill($("log-state"), "loading…", "muted");
  $("status").textContent = "";
  $("log").replaceChildren(el("div", "empty", "Loading…"));
  pollLogs();
}

async function pollLogs() {
  const id = current;
  let wait = 2000;
  try {
    const r = await fetch(`/live/${encodeURIComponent(id)}/logs`, { cache: "no-store" });
    const d = await r.json();
    if (id !== current) return;
    lastData = d;
    renderLogs();
    failures = 0;
    if (ENDED.includes(d.attendee.state)) wait = 10000;  // nothing much happens after the end
  } catch (e) {
    if (id !== current) return;
    failures++;
    wait = Math.min(10000, 2000 * failures);
    setPill($("log-state"), "bridge not reachable", "bad");
  }
  timer = setTimeout(pollLogs, wait);
}

function renderLogs() {
  const d = lastData;
  if (!d) return;
  const a = d.attendee, b = d.bridge;
  if (a.error) setPill($("log-state"), "Attendee unreachable", "bad");
  else setPill($("log-state"), words(a.state), a.state === "fatal_error" ? "bad" : ENDED.includes(a.state) ? "muted" : "on");

  const status = $("status");
  const parts = [];
  if (a.error) parts.push(el("span", "bad", a.error));
  else parts.push(document.createTextNode(`Attendee: recording ${words(a.recording_state)}, transcription ${words(a.transcription_state)}`));
  const bridgeText = b.session === "live"
    ? `bridge: ${b.declined ? "someone said no, session deleted" : b.recording ? "recording" : "not recording (waiting for consent)"}`
    : b.session === "saved" ? "bridge: saved session (bridge restarted or meeting over)" : "bridge: no webhooks received yet";
  parts.push(document.createTextNode(" · " + bridgeText));
  status.replaceChildren(...parts);

  const show = new Set([...document.querySelectorAll(".filters input:checked")].map(i => i.dataset.src));
  const rows = d.log.filter(e => show.has(e.source));
  const key = JSON.stringify([rows, d.hidden]);
  if (key === shownKey) return;
  shownKey = key;
  const box = $("log");
  const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  if (!rows.length) {
    box.replaceChildren(el("div", "empty", d.log.length ? "Nothing for the selected sources." : "No log lines yet."));
    return;
  }
  const nodes = rows.map(e => {
    const row = el("div", `ev ${e.source} ${e.kind === "error" ? "error" : e.kind}`);
    row.append(el("span", "t", clock(e.ms)), el("span", "src", e.source), el("span", "", e.text));
    return row;
  });
  if (d.hidden) nodes.unshift(el("div", "empty", `${d.hidden} earlier lines not shown.`));
  box.replaceChildren(...nodes);
  if (stick) box.scrollTop = box.scrollHeight;
}
document.querySelectorAll(".filters input").forEach(i => i.addEventListener("change", () => { shownKey = ""; renderLogs(); }));

route();
</script>
</body>
</html>
